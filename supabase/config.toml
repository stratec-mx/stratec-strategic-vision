# Proyecto de Supabase en producción (el que usa el sitio vía VITE_SUPABASE_URL)
project_id = "xtfsqdwkbsghkzszpisz"

# submit-lead la llaman formularios públicos del sitio solo con el header apikey;
# tiene su propio límite por IP, así que no exige JWT de usuario.
[functions.submit-lead]
verify_jwt = false

# Alta de usuarios desde el dashboard: exige sesión (la función además verifica rol admin)
[functions.admin-create-user]
verify_jwt = true

# El bot de WhatsApp (Railway) avisa de prospectos. Se autentica con el header
# X-Agente-Secret contra el secret WHATSAPP_LEAD_SECRET, no con sesión de usuario.
[functions.whatsapp-lead]
verify_jwt = false
